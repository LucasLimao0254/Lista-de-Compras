# Worker de avisos por push do Controle Financeiro. Passo a passo em LEIA-ME.md.
name = "controle-financeiro-avisos"
main = "worker.mjs"
compatibility_date = "2025-01-01"

# Confere a cada hora quem tem conta perto de vencer (cada pessoa recebe na hora que escolheu no app)
[triggers]
crons = ["0 * * * *"]

# npx wrangler kv namespace create SUBS   -> copie o "id" que ele mostrar para cá
[[kv_namespaces]]
binding = "SUBS"
id = "COLE_AQUI_O_ID_DO_KV"

[vars]
# Endereço do app (só ele pode falar com este Worker). Se o seu for outro, troque.
ALLOWED_ORIGINS = "https://lucaslimao0254.github.io"
# Contato que os serviços de push recebem junto com cada envio (exigido pelo padrão VAPID). Use o seu e-mail.
VAPID_SUBJECT = "mailto:SEU-EMAIL@exemplo.com"
# Saída de: node gen-vapid.mjs  (a chave PÚBLICA; a privada NÃO vai aqui)
VAPID_PUBLIC_KEY = "COLE_AQUI_A_CHAVE_PUBLICA"
